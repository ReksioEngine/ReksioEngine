name: Run tests

on:
    push:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
        steps:
            - uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '22'
                  cache: 'yarn'

            - run: yarn install --frozen-lockfile
            - run: yarn test
